<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiny Scramble</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener("resize",resize);
  resize();

  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const rand=(a,b)=>a+Math.random()*(b-a);

  let hold=false, gameOver=false, started=false;
  let score=0, best=+(localStorage.tinyScrambleBest||0), fuel=100, speed=210;
  let t=0, shake=0, nextSpawn=0, nextFuel=0, nextAmmo=0, nextEnemy=0;
  let bullets=[], bombs=[], enemies=[], pickups=[], particles=[];
  let terrain=[], terrainX=0;
  let bombAmmo=3, bombReload=0;
  const MAX_BOMBS=3, BOMB_RELOAD_TIME=5;

  const ship = {x:110,y:180,vy:0,w:34,h:16};

  function reset(){
    gameOver=false; started=false; score=0; fuel=100; speed=210; t=0; shake=0;
    bullets=[]; bombs=[]; enemies=[]; pickups=[]; particles=[];
    ship.y=H*0.45; ship.vy=0;
    bombAmmo=MAX_BOMBS; bombReload=0;
    terrain=[]; terrainX=0;
    let x=-40, y=H*0.78;
    while(x<W+240){
      terrain.push({x,y});
      x += 70;
      y = clamp(y + rand(-55,55), H*0.56, H*0.88);
    }
    nextSpawn=.2; nextFuel=4; nextAmmo=9; nextEnemy=2;
  }

  function groundYAt(x){
    for(let i=0;i<terrain.length-1;i++){
      const a=terrain[i], b=terrain[i+1];
      if(x>=a.x && x<=b.x){
        const q=(x-a.x)/(b.x-a.x);
        return a.y+(b.y-a.y)*q;
      }
    }
    return H;
  }

  function explode(x,y,n=16){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), s=rand(40,180);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7)});
    }
    shake=Math.max(shake,6);
  }

  function crash(){
    if(gameOver) return;
    gameOver=true;
    explode(ship.x,ship.y,32);
    best=Math.max(best,Math.floor(score));
    localStorage.tinyScrambleBest=best;
  }

  function dropBomb(){
    if(bombAmmo<=0) return;
    bombAmmo--;
    // Releases feel exactly as before; scarcity, not the flight control, limits spam.
    bombs.push({x:ship.x+4,y:ship.y+8,vx:42,vy:55});
  }

  function press(){
    if(gameOver){ reset(); return; }
    hold=true; started=true;
  }
  function release(){
    if(hold && started && !gameOver) dropBomb();
    hold=false;
  }

  addEventListener("keydown",e=>{
    if(["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); press(); }
  });
  addEventListener("keyup",e=>{
    if(["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); release(); }
  });
  canvas.addEventListener("pointerdown",e=>{ e.preventDefault(); press(); });
  addEventListener("pointerup",release);
  addEventListener("pointercancel",release);

  function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function update(dt){
    if(!started || gameOver){
      particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});
      particles=particles.filter(p=>p.life>0);
      shake*=Math.pow(.02,dt);
      return;
    }

    t+=dt;
    score += dt*10;
    speed = 210 + Math.min(180, score*0.055);
    fuel -= dt*(2.4 + speed/500);
    if(fuel<=0){ fuel=0; crash(); }

    // Hold to climb, release to descend.
    const accel = hold ? -520 : 390;
    ship.vy += accel*dt;
    ship.vy *= Math.pow(.985,dt*60);
    ship.vy = clamp(ship.vy,-270,300);
    ship.y += ship.vy*dt;
    if(ship.y<18){ship.y=18;ship.vy=Math.max(0,ship.vy*.2);}
    if(ship.y>H-20) crash();

    // Refill one missing bomb every few seconds. A full rack stops the timer.
    if(bombAmmo<MAX_BOMBS){
      bombReload += dt;
      if(bombReload>=BOMB_RELOAD_TIME){
        bombAmmo++;
        bombReload-=BOMB_RELOAD_TIME;
        if(bombAmmo>=MAX_BOMBS){ bombAmmo=MAX_BOMBS; bombReload=0; }
      }
    }else{
      bombReload=0;
    }

    // Scroll/generate terrain.
    const dx=speed*dt;
    terrain.forEach(p=>p.x-=dx);
    while(terrain.length && terrain[1]?.x < -80) terrain.shift();
    while(terrain[terrain.length-1].x < W+180){
      const last=terrain[terrain.length-1];
      let y=clamp(last.y+rand(-58,58),H*.56,H*.88);
      terrain.push({x:last.x+70,y});
    }

    // Terrain collision.
    const gy=groundYAt(ship.x+ship.w*.2);
    if(ship.y+ship.h*.55 > gy) crash();

    // Automatic gun.
    nextSpawn -= dt;
    if(nextSpawn<=0){
      bullets.push({x:ship.x+20,y:ship.y,vx:520});
      nextSpawn=.16;
    }

    // Bombing is handled deterministically on control release.

    nextEnemy -= dt;
    if(nextEnemy<=0){
      const x=W+30;
      const kind=Math.random()<.6 ? "turret" : "drone";
      // Pick the kind first, then place it appropriately. Turrets sit on the ground;
      // drones occupy the air. (The old version randomized these independently.)
      const y = kind==="turret" ? groundYAt(x)-8 : rand(65,H*.45);
      enemies.push({x,y,w:22,h:16,kind});
      nextEnemy=rand(.8,1.65);
    }

    nextFuel -= dt;
    if(nextFuel<=0){
      pickups.push({x:W+40,y:groundYAt(W+40)-24,w:24,h:18,kind:"fuel"});
      nextFuel=rand(4.5,7.5);
    }

    nextAmmo -= dt;
    if(nextAmmo<=0){
      pickups.push({x:W+80,y:groundYAt(W+80)-24,w:24,h:18,kind:"ammo"});
      nextAmmo=rand(10,16);
    }

    bullets.forEach(b=>b.x+=b.vx*dt);
    bullets=bullets.filter(b=>b.x<W+40);

    bombs.forEach(b=>{
      // Fixed screen-relative forward drift makes every bomb follow the same arc,
      // independent of the current scroll speed.
      b.vy+=300*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    });

    enemies.forEach(e=>{
      e.x-=dx;
      // Keep ground emplacements glued to the scrolling terrain.
      if(e.kind==="turret") e.y=groundYAt(e.x)-8;
    });
    pickups.forEach(p=>p.x-=dx);

    // Bullet hits.
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];
      let hit=false;
      for(let bi=bullets.length-1;bi>=0;bi--){
        const b=bullets[bi];
        if(rectHit(b.x-2,b.y-2,5,4,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          bullets.splice(bi,1); hit=true; break;
        }
      }
      if(hit){
        explode(e.x,e.y,12);
        enemies.splice(ei,1);
        score+=20;
      }
    }

    // Bomb-ground / target hits.
    for(let bi=bombs.length-1;bi>=0;bi--){
      const b=bombs[bi];
      let removed=false;
      for(let ei=enemies.length-1;ei>=0;ei--){
        const e=enemies[ei];
        if(Math.hypot(b.x-e.x,b.y-e.y)<24){
          explode(e.x,e.y,14);
          enemies.splice(ei,1);
          bombs.splice(bi,1);
          score+=25; removed=true; break;
        }
      }
      if(removed) continue;
      const g=groundYAt(b.x);
      if(b.y>g){
        explode(b.x,g,6);
        bombs.splice(bi,1);
      }
    }

    // Ship/enemy collision.
    for(const e of enemies){
      if(rectHit(ship.x-ship.w/2,ship.y-ship.h/2,ship.w,ship.h,
                 e.x-e.w/2,e.y-e.h/2,e.w,e.h)) crash();
    }

    // Supply crates: fly close to collect OR bomb/shoot them.
    for(let pi=pickups.length-1;pi>=0;pi--){
      const p=pickups[pi];
      let got=rectHit(ship.x-ship.w/2,ship.y-ship.h/2,ship.w,ship.h,
                      p.x-p.w/2,p.y-p.h/2,p.w,p.h);

      for(let bi=bullets.length-1;bi>=0 && !got;bi--){
        if(Math.hypot(bullets[bi].x-p.x,bullets[bi].y-p.y)<16){
          bullets.splice(bi,1); got=true;
        }
      }
      for(let bi=bombs.length-1;bi>=0 && !got;bi--){
        if(Math.hypot(bombs[bi].x-p.x,bombs[bi].y-p.y)<20){
          bombs.splice(bi,1); got=true;
        }
      }
      if(got){
        if(p.kind==="ammo"){
          bombAmmo=MAX_BOMBS;
          bombReload=0;
          score+=25;
        }else{
          fuel=clamp(fuel+30,0,100);
          score+=35;
        }
        explode(p.x,p.y,10);
        pickups.splice(pi,1);
      }
    }

    enemies=enemies.filter(e=>e.x>-60);
    pickups=pickups.filter(p=>p.x>-60);

    particles.forEach(p=>{
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=80*dt; p.life-=dt;
    });
    particles=particles.filter(p=>p.life>0);
    shake*=Math.pow(.02,dt);
  }

  function draw(){
    ctx.save();
    const sx=shake?rand(-shake,shake):0, sy=shake?rand(-shake,shake):0;
    ctx.translate(sx,sy);

    ctx.fillStyle="#05070a";
    ctx.fillRect(-10,-10,W+20,H+20);

    // stars
    ctx.fillStyle="#8aa0b8";
    for(let i=0;i<45;i++){
      const x=(i*173 + (t*speed*.08))%(W+60)-30;
      const y=(i*97)%Math.max(80,H*.52);
      ctx.fillRect(W-x,y,1,1);
    }

    // terrain
    ctx.beginPath();
    ctx.moveTo(terrain[0]?.x ?? 0,H);
    for(const p of terrain) ctx.lineTo(p.x,p.y);
    ctx.lineTo(W+100,H); ctx.closePath();
    ctx.fillStyle="#102019"; ctx.fill();
    ctx.strokeStyle="#45d483"; ctx.lineWidth=2; ctx.stroke();

    // supply pickups
    for(const p of pickups){
      ctx.fillStyle=p.kind==="ammo"?"#ff9f43":"#f2ce4a";
      ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);
      ctx.fillStyle="#111";
      ctx.font="bold 11px monospace";
      ctx.fillText(p.kind==="ammo"?"B":"F",p.x-4,p.y+4);
    }

    // enemies
    for(const e of enemies){
      ctx.fillStyle=e.kind==="turret"?"#ff725c":"#d88cff";
      if(e.kind==="turret"){
        ctx.fillRect(e.x-10,e.y-7,20,14);
        ctx.fillRect(e.x-2,e.y-15,4,10);
      }else{
        ctx.beginPath();
        ctx.moveTo(e.x-12,e.y);
        ctx.lineTo(e.x+8,e.y-7);
        ctx.lineTo(e.x+12,e.y);
        ctx.lineTo(e.x+8,e.y+7);
        ctx.closePath(); ctx.fill();
      }
    }

    // bullets / bombs
    ctx.fillStyle="#fff";
    for(const b of bullets) ctx.fillRect(b.x,b.y-1,8,2);
    ctx.fillStyle="#ffb347";
    for(const b of bombs){
      ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
    }

    // ship
    if(!gameOver || Math.floor(t*14)%2===0){
      ctx.save();
      ctx.translate(ship.x,ship.y);
      ctx.rotate(clamp(ship.vy/900,-.25,.25));
      ctx.fillStyle="#e9f1ff";
      ctx.beginPath();
      ctx.moveTo(20,0); ctx.lineTo(-10,-8); ctx.lineTo(-17,0); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#46b7ff";
      ctx.fillRect(-8,-5,8,4);
      ctx.fillStyle="#ff654a";
      ctx.beginPath();ctx.moveTo(-17,-4);ctx.lineTo(-29,0);ctx.lineTo(-17,4);ctx.fill();
      ctx.restore();
    }

    // particles
    ctx.fillStyle="#ffce59";
    for(const p of particles){
      ctx.globalAlpha=clamp(p.life*2,0,1);
      ctx.fillRect(p.x,p.y,3,3);
    }
    ctx.globalAlpha=1;

    // HUD
    ctx.fillStyle="#fff";
    ctx.font="16px monospace";
    ctx.fillText(`SCORE ${String(Math.floor(score)).padStart(5,"0")}`,18,28);
    ctx.fillText(`BEST ${String(best).padStart(5,"0")}`,18,50);

    ctx.fillText("FUEL",W-170,28);
    ctx.strokeStyle="#fff";
    ctx.strokeRect(W-118,16,100,14);
    ctx.fillStyle=fuel<25?"#ff5c5c":"#66e27f";
    ctx.fillRect(W-116,18,96*(fuel/100),10);

    ctx.fillStyle="#fff";
    ctx.fillText("BOMBS",W-170,54);
    for(let i=0;i<MAX_BOMBS;i++){
      ctx.strokeStyle="#fff";
      ctx.strokeRect(W-116+i*25,42,17,12);
      if(i<bombAmmo){
        ctx.fillStyle="#ffb347";
        ctx.fillRect(W-114+i*25,44,13,8);
      }
    }

    if(!started && !gameOver){
      ctx.textAlign="center";
      ctx.fillStyle="#fff";
      ctx.font="bold 28px monospace";
      ctx.fillText("TINY SCRAMBLE",W/2,H*.28);
      ctx.font="17px monospace";
      ctx.fillText("HOLD to climb • RELEASE to dive + bomb",W/2,H*.28+38);
      ctx.fillText("3 bombs • one reloads every 5 seconds",W/2,H*.28+65);
      ctx.fillText("F = fuel • B = bomb refill",W/2,H*.28+92);
      ctx.fillText("Space / ↑ / touch to start",W/2,H*.28+132);
      ctx.textAlign="left";
    }

    if(gameOver){
      ctx.textAlign="center";
      ctx.fillStyle="#fff";
      ctx.font="bold 28px monospace";
      ctx.fillText("CRASHED",W/2,H*.32);
      ctx.font="17px monospace";
      ctx.fillText(`Score ${Math.floor(score)}  •  Best ${best}`,W/2,H*.32+36);
      ctx.fillText("Press / tap to restart",W/2,H*.32+72);
      ctx.textAlign="left";
    }

    ctx.restore();
  }

  let last=performance.now();
  function frame(now){
    let dt=Math.min(.033,(now-last)/1000);
    last=now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
