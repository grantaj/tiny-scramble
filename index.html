<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tiny Scramble</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W=0,H=0;
  function resize(){
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize",resize);
  resize();

  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const rand=(a,b)=>a+Math.random()*(b-a);

  let hold, gameOver, started, startCharge;
  let score, fuel, speed, t, shake, nextShot, nextFuel, nextEnemy;
  let bullets, bombs, enemies, pickups, particles, terrain;
  let bombCooldown, bombHeat, bombSinceLast, climbRecovery;
  let best=+(localStorage.tinyScrambleBest||0);
  const BOMB_BASE_COOLDOWN=.12, BOMB_MAX_COOLDOWN=1.4, BOMB_BURST_WINDOW=1, BOMB_CLIMB_RESET=.35;
  const START_HOLD=.75;

  const ship = {x:110,w:34,h:16};

  function reset(){
    gameOver=false; started=false; hold=false; startCharge=0;
    score=0; fuel=100; speed=210; t=0; shake=0;
    bullets=[]; bombs=[]; enemies=[]; pickups=[]; particles=[];
    ship.y=H*.45; ship.vy=0;
    bombCooldown=0; bombHeat=0; bombSinceLast=99; climbRecovery=0;
    terrain=[];
    let x=-40, y=H*.78;
    while(x<W+240){
      terrain.push({x,y});
      x += 70;
      y = clamp(y + rand(-55,55), H*.56, H*.88);
    }
    nextShot=.2; nextFuel=4; nextEnemy=2;
  }

  function groundYAt(x){
    for(let i=0;i<terrain.length-1;i++){
      const a=terrain[i], b=terrain[i+1];
      if(x>=a.x && x<=b.x){
        const q=(x-a.x)/(b.x-a.x);
        return a.y+(b.y-a.y)*q;
      }
    }
    return H;
  }

  function explode(x,y,n=16){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), s=rand(40,180);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7)});
    }
    shake=Math.max(shake,6);
  }

  function updateParticles(dt,gravity){
    particles.forEach(p=>{
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=gravity*dt; p.life-=dt;
    });
    particles=particles.filter(p=>p.life>0);
    shake*=Math.pow(.02,dt);
  }

  function crash(){
    if(gameOver) return;
    gameOver=true; hold=false; startCharge=0;
    explode(ship.x,ship.y,32);
    best=Math.max(best,Math.floor(score));
    localStorage.tinyScrambleBest=best;
  }

  function dropBomb(){
    if(bombCooldown>0) return;
    // An isolated release starts a fresh burst, so ordinary flying does not build
    // up a long-lived bombing penalty. Only closely spaced bombs add heat.
    if(bombSinceLast>BOMB_BURST_WINDOW) bombHeat=0;
    bombs.push({x:ship.x+4,y:ship.y+8,vy:55});
    bombCooldown=Math.min(BOMB_MAX_COOLDOWN,BOMB_BASE_COOLDOWN*Math.pow(2,bombHeat));
    bombHeat=Math.min(4,bombHeat+1);
    bombSinceLast=0;
  }

  function launch(){
    if(gameOver) reset();
    started=true;
  }

  function press(){
    if(!started || gameOver) startCharge=0;
    hold=true;
  }

  function release(){
    if(!started || gameOver){
      if(hold && startCharge>=1) launch();
      startCharge=0;
    }else if(hold){
      dropBomb();
    }
    hold=false;
    climbRecovery=0;
  }

  addEventListener("keydown",e=>{
    if(["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); if(!e.repeat) press(); }
  });
  addEventListener("keyup",e=>{
    if(["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); release(); }
  });
  canvas.addEventListener("pointerdown",e=>{ e.preventDefault(); press(); });
  addEventListener("pointerup",release);
  addEventListener("pointercancel",release);
  addEventListener("blur",()=>{
    hold=false; startCharge=0; climbRecovery=0;
  });

  function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
    return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
  }

  function update(dt){
    if(!started || gameOver){
      updateParticles(dt,0);
      if(hold) startCharge=clamp(startCharge+dt/START_HOLD,0,1);
      return;
    }

    t+=dt;
    score += dt*10;
    speed = 210 + Math.min(180, score*.055);
    fuel -= dt*(2.4 + speed/500);
    if(fuel<=0){ fuel=0; crash(); }

    // Hold to climb, release to descend.
    const accel = hold ? -520 : 390;
    ship.vy += accel*dt;
    ship.vy *= Math.pow(.985,dt*60);
    ship.vy = clamp(ship.vy,-270,300);
    ship.y += ship.vy*dt;
    if(ship.y<18){ship.y=18;ship.vy=Math.max(0,ship.vy*.2);}
    if(ship.y>H-20) crash();

    // This is a burst limiter, not ammunition. Cooldown is short, an ordinary
    // pause starts the next burst fresh, and a brief sustained climb clears it now.
    bombCooldown=Math.max(0,bombCooldown-dt);
    bombSinceLast+=dt;
    if(hold){
      climbRecovery+=dt;
      if(climbRecovery>=BOMB_CLIMB_RESET){
        bombHeat=0;
        bombCooldown=0;
        bombSinceLast=BOMB_BURST_WINDOW+1;
      }
    }

    // Scroll/generate terrain.
    const dx=speed*dt;
    terrain.forEach(p=>p.x-=dx);
    while(terrain.length && terrain[1]?.x < -80) terrain.shift();
    while(terrain[terrain.length-1].x < W+180){
      const last=terrain[terrain.length-1];
      let y=clamp(last.y+rand(-58,58),H*.56,H*.88);
      terrain.push({x:last.x+70,y});
    }

    // Terrain collision.
    const gy=groundYAt(ship.x+ship.w*.2);
    if(ship.y+ship.h*.55 > gy) crash();

    // Automatic gun.
    nextShot -= dt;
    if(nextShot<=0){
      bullets.push({x:ship.x+20,y:ship.y});
      nextShot=.16;
    }

    nextEnemy -= dt;
    if(nextEnemy<=0){
      const x=W+30;
      const kind=Math.random()<.6 ? "turret" : "drone";
      const y = kind==="turret" ? groundYAt(x)-8 : rand(65,H*.45);
      enemies.push({x,y,w:22,h:16,kind});
      nextEnemy=rand(.8,1.65);
    }

    nextFuel -= dt;
    if(nextFuel<=0){
      pickups.push({x:W+40,y:groundYAt(W+40)-24,w:24,h:18});
      nextFuel=rand(4.5,7.5);
    }

    bullets.forEach(b=>b.x+=520*dt);
    bullets=bullets.filter(b=>b.x<W+40);

    bombs.forEach(b=>{
      b.vy+=300*dt; b.x+=42*dt; b.y+=b.vy*dt;
    });

    enemies.forEach(e=>{
      e.x-=dx;
      if(e.kind==="turret") e.y=groundYAt(e.x)-8;
    });
    pickups.forEach(p=>p.x-=dx);

    // Bullet hits.
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];
      let hit=false;
      for(let bi=bullets.length-1;bi>=0;bi--){
        const b=bullets[bi];
        if(rectHit(b.x-2,b.y-2,5,4,e.x-e.w/2,e.y-e.h/2,e.w,e.h)){
          bullets.splice(bi,1); hit=true; break;
        }
      }
      if(hit){
        explode(e.x,e.y,12);
        enemies.splice(ei,1);
        score+=20;
      }
    }

    // Bomb-ground / target hits.
    for(let bi=bombs.length-1;bi>=0;bi--){
      const b=bombs[bi];
      let removed=false;
      for(let ei=enemies.length-1;ei>=0;ei--){
        const e=enemies[ei];
        if(Math.hypot(b.x-e.x,b.y-e.y)<24){
          explode(e.x,e.y,14);
          enemies.splice(ei,1);
          bombs.splice(bi,1);
          score+=25; removed=true; break;
        }
      }
      if(removed) continue;
      const g=groundYAt(b.x);
      if(b.y>g){
        explode(b.x,g,6);
        bombs.splice(bi,1);
      }
    }

    // Ship/enemy collision.
    for(const e of enemies){
      if(rectHit(ship.x-ship.w/2,ship.y-ship.h/2,ship.w,ship.h,
                 e.x-e.w/2,e.y-e.h/2,e.w,e.h)) crash();
    }

    // Fuel canister: fly close to collect OR bomb/shoot it.
    for(let pi=pickups.length-1;pi>=0;pi--){
      const p=pickups[pi];
      let got=rectHit(ship.x-ship.w/2,ship.y-ship.h/2,ship.w,ship.h,
                      p.x-p.w/2,p.y-p.h/2,p.w,p.h);

      for(let bi=bullets.length-1;bi>=0 && !got;bi--){
        if(Math.hypot(bullets[bi].x-p.x,bullets[bi].y-p.y)<16){
          bullets.splice(bi,1); got=true;
        }
      }
      for(let bi=bombs.length-1;bi>=0 && !got;bi--){
        if(Math.hypot(bombs[bi].x-p.x,bombs[bi].y-p.y)<20){
          bombs.splice(bi,1); got=true;
        }
      }
      if(got){
        fuel=clamp(fuel+30,0,100);
        score+=35;
        explode(p.x,p.y,10);
        pickups.splice(pi,1);
      }
    }

    enemies=enemies.filter(e=>e.x>-60);
    pickups=pickups.filter(p=>p.x>-60);
    updateParticles(dt,80);
  }

  function drawStartBar(y){
    const bw=Math.min(210,W*.46),bh=10,x=W/2-bw/2;
    ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.strokeRect(x,y,bw,bh);
    ctx.fillStyle=startCharge>=1?"#f2ce4a":"#8eb7d8";
    ctx.fillRect(x+2,y+2,(bw-4)*startCharge,bh-4);
    ctx.fillStyle="#fff";ctx.font="13px monospace";ctx.textAlign="center";
    ctx.fillText(startCharge>=1?"RELEASE":"HOLD TO START",W/2,y+29);
  }

  function draw(){
    ctx.save();
    const sx=shake?rand(-shake,shake):0, sy=shake?rand(-shake,shake):0;
    ctx.translate(sx,sy);

    ctx.fillStyle="#05070a";
    ctx.fillRect(-10,-10,W+20,H+20);

    // stars
    ctx.fillStyle="#8aa0b8";
    for(let i=0;i<45;i++){
      const x=(i*173 + (t*speed*.08))%(W+60)-30;
      const y=(i*97)%Math.max(80,H*.52);
      ctx.fillRect(W-x,y,1,1);
    }

    // terrain
    ctx.beginPath();
    ctx.moveTo(terrain[0]?.x ?? 0,H);
    for(const p of terrain) ctx.lineTo(p.x,p.y);
    ctx.lineTo(W+100,H); ctx.closePath();
    ctx.fillStyle="#102019"; ctx.fill();
    ctx.strokeStyle="#45d483"; ctx.lineWidth=2; ctx.stroke();

    // fuel pickups
    for(const p of pickups){
      ctx.fillStyle="#f2ce4a";
      ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);
      ctx.fillStyle="#111";
      ctx.font="bold 11px monospace";
      ctx.fillText("F",p.x-4,p.y+4);
    }

    // enemies
    for(const e of enemies){
      ctx.fillStyle=e.kind==="turret"?"#ff725c":"#d88cff";
      if(e.kind==="turret"){
        ctx.fillRect(e.x-10,e.y-7,20,14);
        ctx.fillRect(e.x-2,e.y-15,4,10);
      }else{
        ctx.beginPath();
        ctx.moveTo(e.x-12,e.y);
        ctx.lineTo(e.x+8,e.y-7);
        ctx.lineTo(e.x+12,e.y);
        ctx.lineTo(e.x+8,e.y+7);
        ctx.closePath(); ctx.fill();
      }
    }

    // bullets / bombs
    ctx.fillStyle="#fff";
    for(const b of bullets) ctx.fillRect(b.x,b.y-1,8,2);
    ctx.fillStyle="#ffb347";
    for(const b of bombs){
      ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
    }

    // ship
    if(!gameOver || Math.floor(t*14)%2===0){
      ctx.save();
      ctx.translate(ship.x,ship.y);
      ctx.rotate(clamp(ship.vy/900,-.25,.25));
      ctx.fillStyle="#e9f1ff";
      ctx.beginPath();
      ctx.moveTo(20,0); ctx.lineTo(-10,-8); ctx.lineTo(-17,0); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#46b7ff";
      ctx.fillRect(-8,-5,8,4);
      if(started && !gameOver && bombCooldown<=0){
        ctx.fillStyle="#ffb347";
        ctx.fillRect(-1,8,7,3);
      }
      ctx.fillStyle="#ff654a";
      ctx.beginPath();ctx.moveTo(-17,-4);ctx.lineTo(-29,0);ctx.lineTo(-17,4);ctx.fill();
      ctx.restore();
    }

    // particles
    ctx.fillStyle="#ffce59";
    for(const p of particles){
      ctx.globalAlpha=clamp(p.life*2,0,1);
      ctx.fillRect(p.x,p.y,3,3);
    }
    ctx.globalAlpha=1;

    // HUD
    ctx.fillStyle="#fff";
    ctx.font="16px monospace";
    ctx.fillText(`SCORE ${String(Math.floor(score)).padStart(5,"0")}`,18,28);
    ctx.fillText(`BEST ${String(best).padStart(5,"0")}`,18,50);

    ctx.fillText("FUEL",W-170,28);
    ctx.strokeStyle="#fff";
    ctx.strokeRect(W-118,16,100,14);
    ctx.fillStyle=fuel<25?"#ff5c5c":"#66e27f";
    ctx.fillRect(W-116,18,96*(fuel/100),10);

    if(!started && !gameOver){
      ctx.textAlign="center";
      ctx.fillStyle="#fff";
      ctx.font="bold 28px monospace";
      ctx.fillText("TINY SCRAMBLE",W/2,H*.27);
      ctx.font="17px monospace";
      ctx.fillText("HOLD to climb • RELEASE to dive + bomb",W/2,H*.27+38);
      drawStartBar(H*.27+65);
      ctx.textAlign="left";
    }

    if(gameOver){
      ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";
      ctx.fillStyle="#fff";
      ctx.font="bold 28px monospace";
      ctx.fillText("CRASHED",W/2,H*.31);
      ctx.font="17px monospace";
      ctx.fillText(`Score ${Math.floor(score)}  •  Best ${best}`,W/2,H*.31+36);
      drawStartBar(H*.31+61);
      ctx.textAlign="left";
    }

    ctx.restore();
  }

  let last=performance.now();
  function frame(now){
    let dt=Math.min(.033,(now-last)/1000);
    last=now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
