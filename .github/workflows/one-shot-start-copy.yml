name: One-shot start copy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Apply start-screen copy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten start screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('HOLD TO ARM', 'HOLD TO START')
          old = '''      ctx.fillText("HOLD to climb • RELEASE to dive + bomb",W/2,H*.27+38);\n      ctx.fillText("Rapid bombing slows briefly • climb to clear",W/2,H*.27+65);\n      ctx.fillText("Shoot or bomb fuel tanks to refuel",W/2,H*.27+92);\n      drawStartBar(H*.27+119);'''
          new = '''      ctx.fillText("HOLD to climb • RELEASE to dive + bomb",W/2,H*.27+38);\n      drawStartBar(H*.27+65);'''
          if old not in s:
              raise SystemExit('expected start-screen block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-start-copy.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Tighten start screen copy'
          git push
